# Gates every push to main and every pull request (doc/0012, doc/0015).
# The tests need no accounts, network or quota: they use fixtures and fake
# `claude` scripts that the tests themselves put first on PATH.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: fmt, clippy, test, musl build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add x86_64-unknown-linux-musl
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Static musl release build
        run: cargo build --release --target x86_64-unknown-linux-musl

  # Releases include macOS (doc/0051), so a failure here turns the run red. Later
  # steps run after a failed one, so one run says all it can. Hung terminal tests
  # are the likely way to fail, hence the limit.
  macos:
    name: macOS fmt, clippy, test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --no-fail-fast

  # ARM is new (doc/0050): the release builds it too, so a failure here warns of
  # a failing release, without turning this run red. Same limit as macOS.
  linux-arm:
    name: Linux aarch64 fmt, clippy, test, musl build (allowed to fail)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 30
    env:
      TARGET: aarch64-unknown-linux-musl
      # The default cc fails to link this target.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image's page lists Rust but does not name rustup, so install it if missing.
      - name: Install the stable toolchain
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if ! command -v rustup >/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/rustup-init" \
              "https://static.rust-lang.org/rustup/dist/$(uname -m)-unknown-linux-gnu/rustup-init"
            chmod +x "$RUNNER_TEMP/rustup-init"
            "$RUNNER_TEMP/rustup-init" -y --no-modify-path --profile minimal --default-toolchain none
          fi
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add "$TARGET"
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --no-fail-fast

      - name: Static musl release build
        id: musl
        if: ${{ !cancelled() }}
        run: cargo build --release --target "$TARGET"

      - name: Check the binary
        if: ${{ !cancelled() && steps.musl.outcome == 'success' }}
        run: |
          if ! command -v file >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq file
          fi
          binary="target/$TARGET/release/tower"
          file "$binary" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "$("$binary" --version)" = "tower $version"
