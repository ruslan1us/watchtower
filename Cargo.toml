[package]
name = "watchtower"
version = "0.1.0"
edition = "2024"
description = "A terminal UI over Claude Code background sessions"
license = "MIT"
publish = false

[lib]
name = "watchtower"
path = "src/lib.rs"

[[bin]]
name = "tower"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shlex = "2.0.1"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

# Per doc/0012: one small static binary.
[profile.release]
lto = true
strip = true
codegen-units = 1
