# Watchtower (tower) example config.
#
# Copy to $XDG_CONFIG_HOME/watchtower/config.toml (by default
# ~/.config/watchtower/config.toml). Every key is optional: a missing file,
# or a missing key, means the built-in default given in the comment. Unknown
# keys are ignored. `~` is expanded in all paths. See
# doc/0002-tech-stack-and-files.md.
#
# Tower's Settings window can also change this file: it edits only the keys
# you change there and keeps comments and formatting, removes a key you reset
# to its default (its comment lines stay), and copies the file once to
# config.toml.bak before its first write. A running tower reloads the file
# when it changes; changed [[accounts]] apply after a restart.
# See doc/0022-tower-writes-its-own-config.md.

# Account used for new sessions and the orchestrator. Must name one of the
# [[accounts]] below.
# Default: the first account listed.
default_account = "main"

# Seconds between polls of `<command> agents --json --all`, per account.
# 1 to 60.
# Default: 2
poll_interval_secs = 2

# Seconds between background `<command> logs <id>` fetches of every working
# session, and of the session tower is attached to, so the logs panel keeps
# the whole screen however long a session works (doc/0030). 0 turns these
# fetches off: the open logs panel still fetches on every poll, and tower
# still fetches once right after it starts a session or an attach returns.
# 0, or 5 to 30. A capture covers only about the last 40 seconds of a
# working session, so a longer interval would lose the overlap between
# captures and the screen would break up again (doc/0031).
# Default: 10
logs_follow_secs = 10

# Folders scanned (one level deep) for git clones in the new-session dialog
# (doc/0008).
# Default: [] (none)
project_roots = ["~/workspace"]

# Folders listed in the new-session dialog even though they are not under a
# root or not git clones.
# Default: [] (none)
extra_projects = ["~/notes"]

# New-session dialog defaults. "default" means the flag is not passed, so
# Claude Code's own default applies.
#
# default | fable | opus | sonnet | haiku | a full model name.
# Default: "default"
default_model = "default"
# default | low | medium | high | xhigh | max
# Default: "default"
default_effort = "default"
# auto | acceptEdits | manual | plan | dontAsk | bypassPermissions
# (--permission-mode is always passed.)
# Default: "auto"
default_permission_mode = "auto"

# Prompt sent when a session continues under another account (key `a`,
# doc/0004). Without a prompt a woken session would sit idle.
# Default: "continue"
handoff_prompt = "continue"

# Whether `a` may hand a session off to an account of another group (see
# `group` under [[accounts]]). A hand-off moves the whole conversation and
# project context under the target account and its terms (training, data
# retention, admin controls), so by default it only goes to accounts of the
# owner's group. Switching accounts to get around usage limits may also
# conflict with Anthropic's Usage Policy. Set to true only if moving sessions
# between these accounts is fine for you.
# Default: false
allow_cross_group_handoff = false

# Look of the session list (doc/0020).
[ui]
# "dashboard": rounded panels with per-state count pills, section
#   separators and a detail panel for the selected row (side panel from 130
#   columns, a strip under the list below that). Needs at least 80x24;
#   a smaller terminal gets the minimal layout until it grows again.
# "minimal": the plain single-column list.
# Colours follow NO_COLOR either way.
# Default: "dashboard"
style = "dashboard"

# Colour theme of the dashboard style (doc/0021). The minimal style keeps
# its own look, and NO_COLOR turns colour off under every theme.
# "neutral": white and grey text, colour only for states and attention.
# "warm": warm greys with a clay-orange accent for titles and keys.
# "terminal": your terminal's own named colours, reverse video for the
#   selection and pills; follows light and dark terminal themes.
# "tokyo-night": the original blue-grey palette.
# Default: "neutral"
theme = "neutral"

# Sessions tower starts (doc/0029).
[sessions]
# Show the subagents (Agent tool) each session runs. Tower passes the
# sessions it starts (new-session dialog, orchestrator) a settings file with
# three observe-only hooks (SubagentStart, SubagentStop, PostToolUse for
# Agent) that run `tower hook`, which records the running subagents in
# tower's own files. They are combined with your own hooks; no Claude Code
# settings file is changed. Sessions started elsewhere show no subagents.
# false: no --settings is passed and the files are ignored.
# Default: true
track_subagents = true

# Accounts (doc/0003). Each one is a Claude Code config dir with its own
# login and background-session supervisor.
#
#   name        Shown in the UI and stored in state.json. Required, unique.
#   command     Run as-is for every call on this account's sessions. Required.
#               Split like a shell would (quotes allowed), but with no `~` or
#               variable expansion. Tower never sets CLAUDE_CONFIG_DIR itself
#               and removes an inherited one, so for a second account use a
#               wrapper that sets it, e.g. a `claude-alt` script containing
#                 #!/bin/sh
#                 CLAUDE_CONFIG_DIR="$HOME/.claude-alt" exec claude "$@"
#   config_dir  The account's CLAUDE_CONFIG_DIR. Used only to recognise which
#               account hosts a running session. Every account needs its own.
#               Default: "~/.claude"
#   group       Accounts under the same organisation and terms, e.g. "work" or
#               "personal": letters, digits, `-` and `_`. Put accounts from
#               different organisations or terms (e.g. an employer-provided
#               account and a personal one) in different groups. A hand-off
#               (key `a`) moves the conversation and project context under the
#               target account's terms, so it only goes to an account of the
#               same group unless allow_cross_group_handoff = true.
#               Default: no group; all accounts without one share a group.
#
# Default: one account, name = "main", command = "claude".

[[accounts]]
name = "main"
command = "claude"
config_dir = "~/.claude"
group = "personal"

[[accounts]]
name = "alt"
command = "claude-alt"               # wrapper that sets CLAUDE_CONFIG_DIR=~/.claude-alt
config_dir = "~/.claude-alt"
group = "personal"

# An employer-provided account belongs in a group of its own: sessions are
# not handed off between it and the personal accounts above.
#
# [[accounts]]
# name = "work"
# command = "claude-work"
# config_dir = "~/.claude-work"
# group = "work"
